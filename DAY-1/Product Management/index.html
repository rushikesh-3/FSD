<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Product Management System</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js"></script>
</head>

<body>
    <div class="container">
        <header>
            <h1>Product Management System</h1>
        </header>
        <main>
            <section id="product-list">
                <h2>Products</h2>
                <div id="products">
                    <div class="global_product_card">
                        <p>Sample Product 1 - 10</p>
                        <p><strong>Description:</strong> This is a sample product description.</p>
                        <div>
                            <button class="delete-btn">Delete</button>
                            <button class="edit-btn">Edit</button>
                        </div>
                    </div>
                    <div class="global_product_card">
                        <p>Sample Product 2 - 20</p>
                        <p><strong>Description:</strong> This is a sample product description.</p>
                        <div>
                            <button class="delete-btn">Delete</button>
                            <button class="edit-btn">Edit</button>
                        </div>
                    </div>
                    <div class="global_product_card">
                        <p>Sample Product 3 - 30</p>
                        <p><strong>Description:</strong> This is a sample product description.</p>
                        <div>
                            <button class="delete-btn">Delete</button>
                            <button class="edit-btn">Edit</button>
                        </div>
                    </div>
                </div>
            </section>
            <section id="product-form">
                <h2>Add Product</h2>
                <div class="add-product-form">
                    <input id="p-name" placeholder="Name">
                    <input id="p-price" placeholder="Price">
                </div>
                <button id="add">Add</button>
            </section>
        </main>
    </div>
    <script src="app.js"></script>
</body>

</html>
