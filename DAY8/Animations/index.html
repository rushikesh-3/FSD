<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Animations</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <h1 class="title">CSS Animations</h1>

    <div class="main">
      <div class="row">
        <h3>Bounce Animation</h3>
        <div class="box bounce"></div>
      </div>

      <div class="row">
        <h3>Rotate Animation</h3>
        <div class="box rotate"></div>
      </div>

      <div class="row">
        <h3>Scale Animation</h3>
        <div class="box scale"></div>
      </div>

      <div class="row">
        <h3>Fade In Animation</h3>
        <div class="box fade"></div>
      </div>

      <div class="row">
        <h3>Slide Right Animation</h3>
        <div class="box slide"></div>
      </div>

      <div class="row">
        <h3>Pulse Animation</h3>
        <div class="box pulse"></div>
      </div>

      <div class="row">
        <h3>Shake Animation</h3>
        <div class="box shake"></div>
      </div>
    </div>
  </body>
</html>
