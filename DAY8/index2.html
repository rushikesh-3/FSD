<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HTML & CSS — Quick Revision Notes</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0d0d1a;
        color: #e2e2f0;
        line-height: 1.6;
      }
      ::-webkit-scrollbar {
        width: 5px;
      }
      ::-webkit-scrollbar-track {
        background: #0d0d1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #e17055;
        border-radius: 3px;
      }

      /* HEADER */
      .hdr {
        background: linear-gradient(135deg, #1a0d1a 0%, #1a1a0d 100%);
        padding: 1.4rem 1.5rem 1rem;
        border-bottom: 1px solid #2a1a2a;
        position: sticky;
        top: 0;
        z-index: 100;
      }
      .hdr-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 0.5rem;
      }
      .hdr h1 {
        font-size: 20px;
        font-weight: 800;
        color: #fff;
      }
      .hdr p {
        font-size: 12px;
        color: #777;
        margin-bottom: 0.7rem;
      }
      .pill-bar {
        display: flex;
        gap: 5px;
        flex-wrap: wrap;
      }
      .pill {
        padding: 5px 12px;
        border-radius: 14px;
        border: 1px solid #2a1a2a;
        background: #13100d;
        color: #888;
        font-size: 11px;
        cursor: pointer;
        transition: all 0.15s;
        font-weight: 500;
        white-space: nowrap;
      }
      .pill:hover,
      .pill.on {
        background: #e17055;
        color: #fff;
        border-color: #e17055;
      }
      .pill.css-pill:hover,
      .pill.css-pill.on {
        background: #6c5ce7;
        border-color: #6c5ce7;
      }

      /* LAYOUT */
      .layout {
        display: flex;
        min-height: calc(100vh - 115px);
      }
      .sidebar {
        width: 195px;
        flex-shrink: 0;
        background: #0a0a10;
        border-right: 1px solid #1a1020;
        padding: 0.8rem 0.6rem;
        position: sticky;
        top: 115px;
        height: calc(100vh - 115px);
        overflow-y: auto;
      }
      .si-label {
        font-size: 10px;
        font-weight: 700;
        color: #444;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        padding: 0.5rem 0.5rem 0.2rem;
        margin-top: 0.4rem;
      }
      .sn {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 5px 8px;
        border-radius: 7px;
        cursor: pointer;
        font-size: 11.5px;
        color: #777;
        transition: all 0.15s;
        margin-bottom: 2px;
      }
      .sn:hover {
        background: #15101a;
        color: #bbb;
      }
      .sn.on {
        background: #1e1030;
        color: #c9a0f5;
        font-weight: 600;
      }
      .sn.html-on {
        background: #1e1800;
        color: #f9e2af;
        font-weight: 600;
      }

      /* MAIN */
      .main {
        flex: 1;
        padding: 1.2rem 1.4rem;
        overflow-y: auto;
        max-width: 900px;
      }
      .sec {
        margin-bottom: 2.5rem;
        scroll-margin-top: 120px;
      }

      /* SECTION HEADER */
      .sec-hdr {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 0.9rem 1.2rem;
        border-radius: 12px;
        margin-bottom: 1rem;
      }
      .sec-hdr.html-hdr {
        background: #1a1200;
        border: 1px solid #3a2800;
      }
      .sec-hdr.css-hdr {
        background: #100a1e;
        border: 1px solid #2a1a4a;
      }
      .sec-icon {
        font-size: 22px;
      }
      .sec-title {
        font-size: 16px;
        font-weight: 700;
        color: #fff;
      }
      .sec-sub {
        font-size: 11px;
        color: #666;
        margin-top: 1px;
      }

      /* CARDS */
      .cards {
        display: flex;
        flex-direction: column;
        gap: 0.65rem;
      }
      .mc {
        background: #0e0e1a;
        border: 1px solid #1e1e30;
        border-radius: 11px;
        overflow: hidden;
      }
      .mc-hdr {
        padding: 0.65rem 1rem;
        cursor: pointer;
        display: flex;
        align-items: flex-start;
        gap: 8px;
        user-select: none;
      }
      .mc-hdr:hover {
        background: #14142a;
      }
      .mc.html-mc .mc-hdr {
        background: #120e00;
        border-bottom: 1px solid #1e1800;
      }
      .mc.html-mc .mc-hdr:hover {
        background: #1a1500;
      }
      .mc.html-mc.open {
        border-color: #5a3800;
      }
      .mc.css-mc .mc-hdr {
        background: #0e0a1e;
        border-bottom: 1px solid #1a1030;
      }
      .mc.css-mc .mc-hdr:hover {
        background: #140e28;
      }
      .mc.css-mc.open {
        border-color: #3a2a6a;
      }
      .mc-tag {
        font-family: "Courier New", monospace;
        font-size: 13px;
        font-weight: 700;
        flex: 1;
      }
      .mc.html-mc .mc-tag {
        color: #f9e2af;
      }
      .mc.css-mc .mc-tag {
        color: #c9a0f5;
      }
      .mc-desc-short {
        font-size: 11px;
        color: #555;
        flex: 2;
        padding-top: 2px;
      }
      .badges {
        display: flex;
        gap: 4px;
        align-items: center;
        flex-shrink: 0;
      }
      .badge {
        font-size: 10px;
        padding: 2px 7px;
        border-radius: 6px;
        font-weight: 600;
        white-space: nowrap;
      }
      .b-cat {
        background: #1e1800;
        color: #f9e2af;
        border: 1px solid #3a2800;
      }
      .b-css {
        background: #1a0e30;
        color: #c9a0f5;
        border: 1px solid #2e1a50;
      }
      .b-imp {
        background: #1e2a0e;
        color: #a6e3a1;
        border: 1px solid #2a4a1a;
      }
      .b-hot {
        background: #2e0e0e;
        color: #f38ba8;
        border: 1px solid #4a1a1a;
      }
      .b-new {
        background: #0e1e2e;
        color: #89b4fa;
        border: 1px solid #1a2e4a;
      }
      .mc-chv {
        font-size: 11px;
        color: #444;
        transition: transform 0.2s;
        flex-shrink: 0;
        margin-top: 2px;
      }
      .mc.open .mc-chv {
        transform: rotate(180deg);
      }
      .mc-body {
        display: none;
        padding: 0.9rem 1rem;
      }
      .mc.open .mc-body {
        display: block;
      }
      .mc-full-desc {
        font-size: 12.5px;
        color: #bbb;
        margin-bottom: 0.8rem;
        line-height: 1.7;
      }
      .mc-full-desc b {
        color: #e2e2f0;
      }
      .mc-full-desc code {
        font-family: "Courier New", monospace;
        background: #0a0a15;
        padding: 1px 5px;
        border-radius: 4px;
        font-size: 11px;
        color: #a6e3a1;
      }

      /* WHEN BOX */
      .when-box {
        background: #0a140a;
        border: 1px solid #1a3a1a;
        border-radius: 8px;
        padding: 0.6rem 0.9rem;
        margin-bottom: 0.7rem;
      }
      .when-box h5 {
        font-size: 10px;
        font-weight: 700;
        color: #a6e3a1;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.4rem;
      }
      .when-box ul {
        list-style: none;
      }
      .when-box ul li {
        font-size: 11.5px;
        color: #aaa;
        padding-left: 14px;
        position: relative;
        line-height: 1.6;
        margin-bottom: 1px;
      }
      .when-box ul li::before {
        content: "→";
        position: absolute;
        left: 0;
        color: #a6e3a1;
        font-size: 10px;
        top: 3px;
      }
      .when-box ul li b {
        color: #e2e2f0;
      }

      /* SYNTAX BOX */
      .syntax-label {
        font-size: 10px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin-bottom: 0.3rem;
      }
      .html-mc .syntax-label {
        color: #f9e2af;
      }
      .css-mc .syntax-label {
        color: #c9a0f5;
      }
      .code {
        font-family: "Courier New", monospace;
        font-size: 11.5px;
        background: #060610;
        color: #cdd6f4;
        padding: 10px 12px;
        border-radius: 8px;
        line-height: 1.9;
        white-space: pre-wrap;
        word-break: break-all;
        margin-bottom: 0.7rem;
        border: 1px solid #15152a;
      }

      /* ATTRIBUTES TABLE */
      .attr-table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 0.7rem;
        font-size: 11.5px;
      }
      .attr-table th {
        background: #111120;
        color: #777;
        font-weight: 600;
        padding: 6px 9px;
        text-align: left;
        border: 1px solid #1e1e30;
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .attr-table td {
        padding: 6px 9px;
        border: 1px solid #15152a;
        color: #ccc;
        vertical-align: top;
        line-height: 1.5;
      }
      .attr-table tr:nth-child(even) td {
        background: #0a0a18;
      }
      .attr-table td:first-child {
        font-family: "Courier New", monospace;
        color: #a6e3a1;
        font-size: 11px;
        white-space: nowrap;
      }
      .attr-table td:nth-child(2) {
        color: #89b4fa;
        font-family: "Courier New", monospace;
        font-size: 11px;
      }

      /* TIP */
      .tip {
        border-left: 2px solid #f9e2af;
        padding: 6px 10px;
        font-size: 11.5px;
        color: #888;
        margin-bottom: 0.5rem;
        border-radius: 0 7px 7px 0;
        background: #12100a;
        line-height: 1.6;
      }
      .css-mc .tip {
        border-left-color: #c9a0f5;
        background: #0e0a18;
      }
      .tip b {
        color: #e2e2f0;
      }

      /* VALUES GRID */
      .val-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
        gap: 6px;
        margin-bottom: 0.7rem;
      }
      .val-item {
        background: #0a0a18;
        border: 1px solid #1a1a2e;
        border-radius: 7px;
        padding: 6px 9px;
      }
      .val-name {
        font-family: "Courier New", monospace;
        font-size: 11px;
        color: #89b4fa;
        margin-bottom: 2px;
        font-weight: 600;
      }
      .val-desc {
        font-size: 11px;
        color: #777;
        line-height: 1.4;
      }

      /* VISUAL DEMO */
      .demo-box {
        background: #0a0a14;
        border: 1px solid #1e1e30;
        border-radius: 8px;
        padding: 0.8rem;
        margin-bottom: 0.7rem;
        overflow: hidden;
      }
      .demo-label {
        font-size: 10px;
        color: #555;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        margin-bottom: 0.5rem;
        font-weight: 600;
      }

      /* GROUP DIVIDER */
      .grp-divider {
        font-size: 10px;
        font-weight: 700;
        color: #534ab7;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        margin: 0.9rem 0 0.4rem;
        padding-left: 2px;
        border-left: 2px solid #534ab7;
        padding-left: 7px;
      }
    </style>
  </head>
  <body>
    <div class="hdr">
      <div class="hdr-row">
        <span style="font-size: 28px">🌐</span>
        <div>
          <h1>HTML & CSS — Quick Revision Notes</h1>
          <p>
            All tags, attributes, selectors, properties, and layout systems.
            Click any card to expand.
          </p>
        </div>
      </div>
      <div class="pill-bar" id="pills"></div>
    </div>

    <div class="layout">
      <div class="sidebar" id="sidebar"></div>
      <div class="main" id="main"></div>
    </div>

    <script>
      const DATA = [
        // ─────────────── HTML SECTIONS ───────────────
        {
          id: "html_structure",
          type: "html",
          icon: "🏗️",
          title: "HTML Document Structure",
          sub: "Boilerplate, metadata, and document skeleton",
          items: [
            {
              tag: "HTML Boilerplate",
              short: "Full document skeleton",
              imp: "🔴 Must",
              cat: "Structure",
              desc: "Every HTML document starts with this skeleton. <b>DOCTYPE</b> tells the browser this is HTML5. <b>lang</b> helps accessibility and SEO. <b>charset UTF-8</b> supports all characters including emojis.",
              when: [
                "Starting any new HTML page",
                "Required for valid HTML5 document",
                "Base for every web project",
              ],
              code: `<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Page description for SEO">
  <title>Page Title</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="favicon.ico">
</head>
<body>
  <!-- Content goes here -->
  <script src="script.js"><\/script>
</body>
</html>`,
              tip: "Put <script> at end of body (not head) so HTML loads before JS runs. Or use defer attribute.",
            },
            {
              tag: "<head> Meta Tags",
              short: "SEO, viewport, charset",
              imp: "🔴 Must",
              cat: "Meta",
              desc: "Meta tags provide metadata about the page. <b>viewport</b> is essential for responsive design. <b>description</b> appears in Google search results. <b>og:</b> tags control social media previews.",
              when: [
                "Every page needs viewport and charset",
                "SEO requires description and title",
                "Social sharing needs og: tags",
              ],
              code: `<head>
  <!-- Character encoding -->
  <meta charset="UTF-8">

  <!-- Responsive design — CRITICAL -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- SEO -->
  <meta name="description" content="My page description">
  <meta name="keywords" content="html, css, web">
  <meta name="author" content="Your Name">

  <!-- Social media (Open Graph) -->
  <meta property="og:title" content="Page Title">
  <meta property="og:description" content="Description">
  <meta property="og:image" content="image.jpg">

  <!-- Redirect after 5 seconds -->
  <meta http-equiv="refresh" content="5; url=https://example.com">

  <title>My Page</title>
</head>`,
              tip: "viewport meta tag is mandatory for mobile-responsive sites. Without it, mobile browsers zoom out and show desktop layout.",
            },
          ],
        },
        {
          id: "html_semantic",
          type: "html",
          icon: "🏛️",
          title: "Semantic HTML Tags",
          sub: "Meaningful structure tags that describe content purpose",
          items: [
            {
              tag: "Structural Semantics",
              short: "header, nav, main, section, article, aside, footer",
              imp: "🔴 Must",
              cat: "Semantic",
              desc: "Semantic tags give meaning to structure. Screen readers, search engines, and developers understand the page layout better. <b>Replace &lt;div&gt; soup with semantic tags.</b>",
              when: [
                "Use instead of meaningless div wrappers",
                "For accessibility and SEO",
                "Any structured webpage layout",
              ],
              code: `<body>
  <header>           <!-- Top of page: logo, nav -->
    <nav>            <!-- Navigation links -->
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/about">About</a></li>
      </ul>
    </nav>
  </header>

  <main>             <!-- Primary page content (only ONE per page) -->
    <section>        <!-- Thematic grouping with heading -->
      <h2>About Us</h2>
      <article>      <!-- Self-contained content (blog post, card) -->
        <h3>Post Title</h3>
        <p>Content...</p>
      </article>
    </section>

    <aside>          <!-- Sidebar, related content -->
      <p>Related links...</p>
    </aside>
  </main>

  <footer>           <!-- Bottom: copyright, links -->
    <p>&copy; 2024</p>
  </footer>
</body>`,
              tip: "Rule: <article> = can be taken out of context and still make sense (blog post, product card). <section> = thematic grouping that needs context.",
            },
            {
              tag: "Text Semantics",
              short:
                "h1-h6, p, strong, em, mark, abbr, time, code, pre, blockquote",
              imp: "🔴 Must",
              cat: "Semantic",
              desc: "Inline semantic tags give meaning to text. <b>strong</b> = important (bold). <b>em</b> = emphasis (italic). These are semantic — not just visual styling.",
              when: [
                "Headings: only one h1 per page, use h2-h6 in order",
                "strong/em for meaningful emphasis",
                "code/pre for displaying code",
              ],
              code: `<h1>Main Page Title</h1>       <!-- Only ONE h1 per page -->
<h2>Section Title</h2>
<h3>Subsection</h3>             <!-- h1 → h2 → h3, don't skip -->

<p>Normal paragraph text.</p>

<strong>Important text</strong>  <!-- Bold + semantic importance -->
<b>Bold without importance</b>   <!-- Just visual bold -->
<em>Emphasized text</em>         <!-- Italic + semantic emphasis -->
<i>Italic without emphasis</i>   <!-- Just visual italic -->

<mark>Highlighted text</mark>
<small>Fine print / legal</small>
<del>Deleted text</del>  <ins>Inserted text</ins>
<sup>superscript</sup>   <sub>subscript</sub>

<abbr title="HyperText Markup Language">HTML</abbr>
<time datetime="2024-01-15">January 15, 2024</time>

<code>inline code</code>
<pre><code>
  // multi-line code block
  function hello() {}
</code></pre>

<blockquote cite="https://source.com">
  "Famous quote here"
</blockquote>`,
              tip: "Heading hierarchy matters for SEO and accessibility. Never skip levels (h1 → h3). h1 = page title, h2 = main sections, h3 = subsections.",
            },
            {
              tag: "<figure> / <figcaption> / <picture>",
              short: "Images with captions, responsive images",
              imp: "🟡 High",
              cat: "Media",
              desc: "<b>figure</b> wraps self-contained content (images, charts, code). <b>picture</b> serves different image sizes/formats based on screen.",
              when: [
                "Image with a caption below it",
                "Responsive images for different screen sizes",
                "WebP with JPEG fallback",
              ],
              code: `<!-- Figure with caption -->
<figure>
  <img src="chart.png" alt="Sales chart for Q4">
  <figcaption>Fig 1: Q4 Sales increased by 40%</figcaption>
</figure>

<!-- Responsive images with <picture> -->
<picture>
  <source srcset="image.webp" type="image/webp">
  <source srcset="image-large.jpg" media="(min-width: 800px)">
  <source srcset="image-small.jpg" media="(max-width: 799px)">
  <img src="image.jpg" alt="Description" loading="lazy">
</picture>

<!-- Responsive img with srcset -->
<img
  srcset="img-400.jpg 400w, img-800.jpg 800w, img-1200.jpg 1200w"
  sizes="(max-width: 600px) 400px, (max-width: 1200px) 800px, 1200px"
  src="img-800.jpg"
  alt="Responsive image"
  loading="lazy"
  width="800" height="600">`,
              tip: "Always include alt text for accessibility. loading='lazy' defers off-screen images. Always specify width and height to prevent layout shift.",
            },
          ],
        },
        {
          id: "html_forms",
          type: "html",
          icon: "📝",
          title: "HTML Forms",
          sub: "Form elements, input types, validation attributes",
          items: [
            {
              tag: "Form Structure & Attributes",
              short: "form, action, method, enctype",
              imp: "🔴 Must",
              cat: "Forms",
              desc: "<b>action</b> = where to submit. <b>method</b> = GET (data in URL) or POST (data in body). <b>enctype</b> multipart needed for file uploads.",
              when: [
                "Any user input collection",
                "Login/signup forms",
                "File upload forms",
              ],
              code: `<form
  action="/submit"
  method="POST"
  enctype="multipart/form-data"  <!-- required for file uploads -->
  novalidate                      <!-- disable browser validation -->
  autocomplete="off">

  <!-- Label + Input pairing — ALWAYS pair them -->
  <label for="email">Email Address</label>
  <input type="email" id="email" name="email" required>

  <button type="submit">Submit</button>
  <button type="reset">Clear</button>
  <button type="button" onclick="doSomething()">Click</button>
</form>`,
              tip: "Always use <label for='id'> paired with input id. This makes clicking the label focus the input — accessibility + usability.",
            },
            {
              tag: "Input Types — All Variants",
              short:
                "text, email, password, number, date, checkbox, radio, file, range, color...",
              imp: "🔴 Must",
              cat: "Forms",
              desc: "HTML5 introduced many input types that provide built-in validation and appropriate mobile keyboards. <b>type is the most important attribute.</b>",
              when: [
                "email type: validates email format automatically",
                "number type: shows numeric keyboard on mobile",
                "date type: shows date picker",
                "file type: file upload button",
              ],
              code: `<!-- Text inputs -->
<input type="text"     placeholder="Enter name" maxlength="50">
<input type="email"    placeholder="user@example.com">
<input type="password" minlength="8">
<input type="number"   min="0" max="100" step="5" value="50">
<input type="tel"      pattern="[0-9]{10}">
<input type="url"      placeholder="https://example.com">
<input type="search"   placeholder="Search...">

<!-- Date/Time -->
<input type="date"          value="2024-01-15">
<input type="time"          value="13:30">
<input type="datetime-local">
<input type="month">
<input type="week">

<!-- Selection -->
<input type="checkbox" id="agree" checked>
<input type="radio"    name="gender" value="male">
<input type="radio"    name="gender" value="female">
<input type="range"    min="0" max="100" value="50" step="10">
<input type="color"    value="#ff5733">

<!-- File & Hidden -->
<input type="file"   accept=".pdf,.jpg" multiple>
<input type="hidden" name="csrf" value="token123">

<!-- Buttons -->
<input type="submit" value="Send">
<input type="reset"  value="Clear">
<input type="image"  src="btn.png" alt="Submit">`,
              tip: "Mobile keyboards change based on input type. type='email' shows @ key. type='tel' shows numpad. type='number' shows number keyboard. Always use correct type!",
            },
            {
              tag: "Form Validation Attributes",
              short: "required, min, max, pattern, minlength, maxlength",

              <span class="badge ${isCSS ? "b-css" : "b-cat"}">${item.cat}</span>
              <span class="badge ${impCls}">${item.imp}</span>
            </div>
            <span class="mc-chv">▼</span>
          </div>
          <div class="mc-body">
            <p class="mc-full-desc">${item.desc}</p>
            <div class="when-box">
              <h5>🟢 When to Use</h5>
              <ul>${whenHTML}</ul>
            </div>
            <div class="syntax-label">Syntax & Examples</div>
            <div class="code">${escH(item.code)}</div>
            <div class="tip">💡 <b>Key Insight:</b> ${item.tip}</div>
          </div>
        </div>`;
            })
            .join("");

          secEl.innerHTML = `
      <div class="sec-hdr ${isCSS ? "css-hdr" : "html-hdr"}">
        <span class="sec-icon">${sec.icon}</span>
        <div>
          <div class="sec-title">${sec.title}</div>
          <div class="sec-sub">${sec.sub}</div>
        </div>
      </div>
      <div class="cards">${itemsHTML}</div>
    `;
          main.appendChild(secEl);
        });
      }

      function tog(id) {
        document.getElementById(id).classList.toggle("open");
      }
      function goTo(id) {
        document
          .getElementById("sec-" + id)
          .scrollIntoView({ behavior: "smooth" });
      }
      function escH(s) {
        return s
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;");
      }

      function setupObserver() {
        const obs = new IntersectionObserver(
          (entries) => {
            entries.forEach((e) => {
              if (e.isIntersecting) {
                const id = e.target.id.replace("sec-", "");
                const sec = DATA.find((d) => d.id === id);
                if (!sec) return;
                document
                  .querySelectorAll(".sn")
                  .forEach((n) => n.classList.remove("on", "html-on"));
                document
                  .querySelectorAll(".pill")
                  .forEach((p) => p.classList.remove("on"));
                const n = document.getElementById("nav-" + id);
                const p = document.getElementById("pill-" + id);
                if (n) n.classList.add(sec.type === "css" ? "on" : "html-on");
                if (p) p.classList.add("on");
              }
            });
          },
          { threshold: 0.12, rootMargin: "-115px 0px 0px 0px" },
        );
        DATA.forEach((s) => {
          const el = document.getElementById("sec-" + s.id);
          if (el) obs.observe(el);
        });
      }

      build();
      setupObserver();
    </script>
  </body>
</html>
