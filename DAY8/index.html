<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#0f0f1a;color:#e2e2f0;line-height:1.6}

/* HEADER */

.body{display:flex;min-height:100vh}
.sidebar{width:220px;flex-shrink:0;background:#0d0d1a;border-right:1px solid #1e1e3a;padding:1rem .8rem;position:sticky;top:0;height:100vh;overflow-y:auto}

.content{flex:1;padding:1.5rem;overflow-y:auto;max-width:900px}

.pcard-meta{flex:1}
.pcard-meta h2{font-size:18px;font-weight:700;color:#fff;margin-bottom:3px}

/* COMPARISON TABLE */

<script>
const PATTERNS = [
{
  id:"arrays", icon:"📦", color:"#f5a623", name:"Arrays",
  tagline:"Foundation of every DSA problem — master indexing, in-place ops, and traversal.",
  when:["Problem gives a list/array of numbers","Need to find max/min/sum/count","In-place modification required (O(1) space)","Searching or sorting within a fixed structure"],
  signals:["Keywords: 'in-place', 'without extra space'","Given array, find element meeting condition","Subarray / subsequence / contiguous elements","Index manipulation needed"],
  subtypes:[
    {name:"Prefix / Suffix Scan",num:1,diff:"e",
     desc:"Traverse from one end tracking a running value (max, min, sum, product). Used when decision at index i depends on everything before or after it.",
     template:`def prefix_scan(arr):
    result = []
    running = arr[0]           # or 0, -inf, etc.
    for i in range(1, len(arr)):
        running = update(running, arr[i])
        result.append(running)
    return result`,
     ex:[{l:"Problem",v:"Max profit (buy-sell stock)"},{l:"Input",v:"[7,1,5,3,6,4]"},{l:"Output",v:"5"},{l:"Key",v:"Track min_price from left, max(profit) at each step"}],
     pitfalls:["Off-by-one: initialize with arr[0], not 0","For buy-sell, never update answer before checking condition"],
     tip:"When answer at index i depends on ALL elements to its left → Prefix scan. To the right → Suffix scan. Both sides → Two-pass."},
    {name:"In-place Modification",num:2,diff:"e",
     desc:"Modify the array directly using one or two pointers, without allocating a new array. Critical for O(1) space solutions.",
     template:`def in_place(arr):
    write = 0                  # write pointer
    for read in range(len(arr)):
        if condition(arr[read]):   # keep this element?
            arr[write] = arr[read]
            write += 1
    return write               # new logical length`,
     ex:[{l:"Problem",v:"Move zeros to end / Remove duplicates"},{l:"Input",v:"[0,1,0,3,12]"},{l:"Output",v:"[1,3,12,0,0]"},{l:"Key",v:"Write pointer only advances on valid elements"}],
     pitfalls:["Don't read from write pointer position","Fill trailing positions explicitly (zeros, etc.)","For sorted duplicates: compare with arr[write-1] not arr[write]"],
     tip:"Write pointer = 'where to place next valid element'. Read pointer = current scan position."},
    {name:"Index as HashMap",num:3,diff:"m",
     desc:"When values are in range [0..n-1], use the array itself as a frequency map by negating values at index positions.",
     template:`def index_as_map(arr):
    for x in arr:
        idx = abs(x) - 1       # map value to index
        arr[idx] = -abs(arr[idx])  # mark visited
    result = []
    for i, v in enumerate(arr):
        if v > 0: result.append(i + 1)  # unmarked = missing
    return result`,
     ex:[{l:"Problem",v:"Find all duplicates / missing numbers"},{l:"Input",v:"[4,3,2,7,8,2,3,1]"},{l:"Output",v:"[2,3] (duplicates)"},{l:"Key",v:"Value x → index x-1. If arr[x-1] already negative = duplicate"}],
     pitfalls:["Values must be 1-indexed for this to work","Always use abs(x) since values may already be negated","Restore array if required by problem"],
     tip:"This trick reduces O(n) space HashMap to O(1) when values are bounded by array size."},
    {name:"Kadane's / Running Optimization",num:4,diff:"m",
     desc:"At each index, decide: start fresh from here, or extend the existing best. Classic example is maximum subarray sum.",
     template:`def kadane(arr):
    cur = res = arr[0]
    for x in arr[1:]:
        cur = max(x, cur + x)  # extend or restart?
        res = max(res, cur)    # track global best
    return res`,
     ex:[{l:"Problem",v:"Max subarray sum"},{l:"Input",v:"[-2,1,-3,4,-1,2,1,-5,4]"},{l:"Output",v:"6 (subarray [4,-1,2,1])"},{l:"Variant",v:"Max product subarray — track both min and max"}],
     pitfalls:["Initialize cur=res=arr[0], NOT 0 (handles all-negative arrays)","For max product: track both cur_max and cur_min (negatives flip sign)"],
     tip:"<b>When to restart?</b> When cur + x < x, i.e., cur < 0. Carrying negative sum only hurts."}
  ]
},
{
  id:"twoptr", icon:"👉👈", color:"#a8e6cf", name:"Two Pointers",
  tagline:"Eliminate nested loops. Two pointers converge from opposite ends — O(n) instead of O(n²).",
  when:["Array or string is sorted (or can be sorted)","Looking for a pair/triplet satisfying a condition","Need to shrink search space from both ends","'Without extra space' requirement"],
  signals:["Find pair with sum/difference = target","Palindrome check","Remove duplicates in-place","Any 'closest to target' problem on sorted array"],
  subtypes:[
    {name:"Opposite Direction (Converging)",num:1,diff:"e",
     desc:"Left starts at 0, right starts at n-1. Both move inward. Used when you want to explore combinations from both ends simultaneously.",
     template:`def two_ptr_converge(arr, target):
    l, r = 0, len(arr) - 1
    while l < r:
        val = arr[l] + arr[r]     # or whatever function
        if val == target:
            return [l, r]         # found
        elif val < target:
            l += 1                # need bigger → move left up
        else:
            r -= 1                # need smaller → move right down`,
     ex:[{l:"Problem",v:"Two Sum on sorted array"},{l:"Input",v:"[2,7,11,15], target=9"},{l:"Output",v:"[0,1]"},{l:"Also used for",v:"Container with water, 3Sum, Reverse array"}],
     pitfalls:["Array MUST be sorted (or problem guarantees sorted)","l < r not l <= r (avoid same element twice)","For 3Sum: fix first element, then use this pattern on remaining"],
     tip:"Move the pointer that needs adjustment: sum too small → move left up; sum too large → move right down."},
    {name:"Same Direction (Slow-Fast)",num:2,diff:"e",
     desc:"Both pointers start at left and move right. Slow tracks a condition, fast scans. Used for in-place filtering and cycle detection.",
     template:`def slow_fast(arr):
    slow = 0                       # write/condition pointer
    for fast in range(len(arr)):
        if condition(arr[fast]):   # valid element
            arr[slow] = arr[fast]
            slow += 1
    return slow                    # new length`,
     ex:[{l:"Problem",v:"Remove duplicates from sorted array"},{l:"Input",v:"[1,1,2,3,3,4]"},{l:"Output",v:"[1,2,3,4], len=4"},{l:"Also used for",v:"Move zeros, remove element, partition"}],
     pitfalls:["slow starts at 0 and only moves on valid elements","Compare arr[fast] with arr[slow] not arr[slow-1] (off-by-one error)"],
     tip:"Slow pointer = 'position of last placed valid element'. Fast = current scanner."},
    {name:"Partitioning (3-way / Dutch National Flag)",num:3,diff:"m",
     desc:"Three pointers lo, mid, hi partition array into 3 regions in a single pass. Classic for sort 0s 1s 2s.",
     template:`def three_way(arr):
    lo = mid = 0
    hi = len(arr) - 1
    while mid <= hi:
        if arr[mid] == 0:          # belongs in left region
            arr[lo], arr[mid] = arr[mid], arr[lo]
            lo += 1; mid += 1
        elif arr[mid] == 1:        # belongs in middle
            mid += 1
        else:                      # arr[mid] == 2, right
            arr[mid], arr[hi] = arr[hi], arr[mid]
            hi -= 1                # don't advance mid!`,
     ex:[{l:"Problem",v:"Sort array of 0s, 1s, 2s"},{l:"Input",v:"[2,0,2,1,1,0]"},{l:"Output",v:"[0,0,1,1,2,2]"},{l:"Key",v:"hi-- but mid stays when swapping from right"}],
     pitfalls:["After swap with hi: do NOT advance mid (swapped value is unexamined)","After swap with lo: advance BOTH lo and mid","Loop condition: mid <= hi not mid < hi"],
     tip:"Region meanings: [0..lo-1]=0s, [lo..mid-1]=1s, [mid..hi]=unknown, [hi+1..n-1]=2s."},
    {name:"Two Pointers on Two Arrays (Merge)",num:4,diff:"e",
     desc:"One pointer per array, both moving forward. Pick the smaller element at each step. Foundation of merge sort's merge step.",
     template:`def merge_two(a, b):
    i = j = 0; result = []
    while i < len(a) and j < len(b):
        if a[i] <= b[j]:
            result.append(a[i]); i += 1
        else:
            result.append(b[j]); j += 1
    return result + a[i:] + b[j:]  # append remaining`,
     ex:[{l:"Problem",v:"Merge two sorted arrays"},{l:"Input",v:"[1,3,5] and [2,4,6]"},{l:"Output",v:"[1,2,3,4,5,6]"},{l:"Also used for",v:"Intersection, union of sorted arrays"}],
     pitfalls:["Never forget to append the remaining elements after one array is exhausted","For in-place merge in sorted array: fill from the end (back-merge)"],
     tip:"Back-merge trick: start from the end of both arrays and fill backwards to avoid shifting."}
  ]
},
{
  id:"prefixsum", icon:"∑", color:"#ffd93d", name:"Prefix Sum",
  tagline:"Precompute cumulative sums to answer range queries in O(1) instead of O(n).",
  when:["Multiple range sum queries on same array","Find subarray with sum = target","Equilibrium index / balance point","2D matrix area sum queries"],
  signals:["'Sum of subarray from l to r'","Count subarrays with specific sum","Equal halves / balance problems","Any 'cumulative' computation"],
  subtypes:[
    {name:"1D Prefix Array",num:1,diff:"e",
     desc:"Build prefix[i] = sum of arr[0..i-1]. Any range sum becomes prefix[r+1] - prefix[l] in O(1).",
     template:`def build_prefix(arr):
    n = len(arr)
    pre = [0] * (n + 1)           # pre[0] = 0 (empty prefix)
    for i in range(n):
        pre[i+1] = pre[i] + arr[i]
    return pre

def range_sum(pre, l, r):
    return pre[r+1] - pre[l]      # sum arr[l..r] inclusive`,
     ex:[{l:"Problem",v:"Range sum query"},{l:"Input",v:"arr=[1,2,3,4,5], query(1,3)"},{l:"Output",v:"9 (2+3+4)"},{l:"Key",v:"pre[4]-pre[1] = 10-1 = 9"}],
     pitfalls:["pre has n+1 elements, not n. pre[0]=0 is sentinel","Range is [l, r] inclusive → pre[r+1] - pre[l]","Off-by-one is the #1 bug here — always verify with small example"],
     tip:"Think of prefix[i] as 'total sum of first i elements'. Subtract to get any window."},
    {name:"Prefix Sum + HashMap (Count Subarrays)",num:2,diff:"m",
     desc:"Combine prefix sums with a HashMap to count subarrays with sum = k. O(n) instead of O(n²).",
     template:`from collections import defaultdict
def count_subarrays_sum_k(arr, k):
    count = defaultdict(int)
    count[0] = 1              # empty prefix has sum 0
    prefix = 0
    result = 0
    for x in arr:
        prefix += x
        result += count[prefix - k]  # how many times did (prefix-k) appear?
        count[prefix] += 1
    return result`,
     ex:[{l:"Problem",v:"Count subarrays with sum = k"},{l:"Input",v:"[1,1,1], k=2"},{l:"Output",v:"2 (indices [0,1] and [1,2])"},{l:"Key",v:"if prefix[j]-prefix[i]=k → subarray i+1..j sums to k"}],
     pitfalls:["Initialize count[0]=1 before the loop (for subarrays starting at index 0)","Add to result BEFORE updating map (avoid counting self)","For zero-sum subarray: use k=0"],
     tip:"The magic equation: prefix[j] - prefix[i] = k → prefix[i] = prefix[j] - k. Look up (prefix - k) in map."},
    {name:"2D Prefix Sum (Matrix)",num:3,diff:"m",
     desc:"Extend prefix sum to 2D matrices. pre[i][j] = sum of all elements in rectangle from (0,0) to (i-1,j-1).",
     template:`def build_2d_prefix(mat):
    m, n = len(mat), len(mat[0])
    pre = [[0]*(n+1) for _ in range(m+1)]
    for i in range(1, m+1):
        for j in range(1, n+1):
            pre[i][j] = (mat[i-1][j-1]
                       + pre[i-1][j]
                       + pre[i][j-1]
                       - pre[i-1][j-1])  # inclusion-exclusion
    return pre

def rect_sum(pre, r1, c1, r2, c2):  # (r1,c1) to (r2,c2) inclusive
    return (pre[r2+1][c2+1] - pre[r1][c2+1]
          - pre[r2+1][c1] + pre[r1][c1])`,
     ex:[{l:"Problem",v:"Sum of submatrix from (r1,c1) to (r2,c2)"},{l:"Key Formula",v:"A + D - B - C (inclusion-exclusion)"},{l:"Also used for",v:"Max sum submatrix, count submatrices"}],
     pitfalls:["Inclusion-exclusion: add top-left corner back after double subtraction","Row and col indices are 1-based in prefix, 0-based in matrix"],
     tip:"Draw a Venn diagram: big rectangle = sum you want + two overlapping strips - double-counted corner."},
    {name:"Difference Array (Range Update)",num:4,diff:"m",
     desc:"Inverse of prefix sum. Apply range updates in O(1), reconstruct with prefix sum in O(n).",
     template:`def range_update(n, updates):
    diff = [0] * (n + 1)
    for l, r, val in updates:
        diff[l] += val         # start adding val at index l
        diff[r+1] -= val       # stop adding val after index r
    
    # Reconstruct final array
    result = []
    running = 0
    for i in range(n):
        running += diff[i]
        result.append(running)
    return result`,
     ex:[{l:"Problem",v:"Add val to range [l,r] for multiple queries"},{l:"Input",v:"n=5, updates=[(1,3,2),(2,4,3)]"},{l:"Output",v:"[0,2,5,5,3]"},{l:"Key",v:"Mark start and end+1 of each update, then prefix sum"}],
     pitfalls:["diff[r+1] not diff[r] (stop AFTER index r)","diff array needs n+1 size for boundary case"],
     tip:"Think of diff[i] as 'change in value at position i'. Prefix sum reconstructs actual values."}
  ]
},
{
  id:"sliding", icon:"🪟", color:"#74b9ff", name:"Sliding Window",
  tagline:"Maintain a window of elements. Avoid recomputing from scratch — add right, remove left.",
  when:["Contiguous subarray / substring required","'Longest/shortest' subarray with condition","Fixed-size window problems","Any problem about a consecutive sequence"],
  signals:["'Maximum/minimum sum of K elements'","'Longest substring with at most K distinct'","'Smallest subarray with sum >= S'","Contiguous elements with a constraint"],
  subtypes:[
    {name:"Fixed-Size Window",num:1,diff:"e",
     desc:"Window size K is constant. Slide by removing leftmost and adding new rightmost element. O(n) instead of O(nk).",
     template:`def fixed_window(arr, k):
    # Build first window
    window_val = sum(arr[:k])
    best = window_val
    
    # Slide the window
    for i in range(k, len(arr)):
        window_val += arr[i]        # add new right element
        window_val -= arr[i - k]    # remove old left element
        best = max(best, window_val)
    return best`,
     ex:[{l:"Problem",v:"Max sum subarray of size K"},{l:"Input",v:"[2,1,5,1,3,2], k=3"},{l:"Output",v:"9 ([5,1,3])"},{l:"Also used for",v:"Average of K elements, first negative in window"}],
     pitfalls:["Build first window separately before the sliding loop","Remove arr[i-k] not arr[i-k+1] (keep track of offset)","Result: use arr[i-k+1..i] as current window"],
     tip:"The element leaving the window is at index (i - k). The element entering is at index i."},
    {name:"Variable-Size Window (Expand-Shrink)",num:2,diff:"m",
     desc:"Window size changes dynamically. Expand right when condition allows, shrink left when condition is violated. Two inner loops but amortized O(n).",
     template:`def variable_window(arr, target):
    l = 0
    window_sum = 0
    best = 0  # or float('inf') for minimum

    for r in range(len(arr)):

     tip:"Two strings are in same group ↔ they map to same canonical key. Any deterministic transformation works."},
    {name:"Find Anagram Substrings (Sliding Window)",num:3,diff:"m",
     desc:"Fixed sliding window of size len(p) over string s. Compare window's character frequencies with pattern's frequencies.",
     template:`from collections import Counter

def find_anagram_positions(s, p):
    if len(p) > len(s): return []
    
    p_count = Counter(p)
    w_count = Counter(s[:len(p)])
    result = []
    
    if p_count == w_count: result.append(0)
    
    for i in range(len(p), len(s)):
        # Add new right character
        w_count[s[i]] += 1
        
        # Remove old left character
        left_char = s[i - len(p)]
        w_count[left_char] -= 1
        if w_count[left_char] == 0:
            del w_count[left_char]   # keep Counter clean
        
        if w_count == p_count:
            result.append(i - len(p) + 1)
    
    return result`,
     ex:[{l:"Input",v:"s='cbaebabacd', p='abc'"},{l:"Output",v:"[0, 6]"},{l:"Window",v:"Fixed size = len(p)"},{l:"Check",v:"w_count == p_count at each position"}],
     pitfalls:["Delete key when count hits 0 (for correct Counter equality)","Or use int array[26] — comparison is always O(26)=O(1) vs O(k) Counter"],
     tip:"Optimization: track 'matches' count (how many chars match p_count). Increment/decrement on each window slide."},
    {name:"Minimum Window Containing All Characters",num:4,diff:"h",
     desc:"Variable window: expand right to cover all pattern chars, then shrink left to minimize window. Classic hard problem.",
     template:`from collections import Counter

def min_window(s, t):
    need = Counter(t)
    missing = len(t)            # how many chars still needed
    l = 0
    result = ""
    
    for r, c in enumerate(s):
        # Expand: include s[r]
        if need[c] > 0: missing -= 1  # one more needed char found
        need[c] -= 1
        
        # Shrink: while all chars covered
        while missing == 0:
            # Update result
            if not result or r - l + 1 < len(result):
                result = s[l:r+1]
            
            need[s[l]] += 1
            if need[s[l]] > 0: missing += 1  # lost a needed char
            l += 1
    
    return result`,
     ex:[{l:"Input",v:"s='ADOBECODEBANC', t='ABC'"},{l:"Output",v:"'BANC'"},{l:"Key",v:"missing=0 means window covers all of t"},{l:"Shrink",v:"When missing=0, try to minimize window"}],
     pitfalls:["need[c] > 0 check: only decrement missing for NEEDED chars (not over-satisfied)","need[s[l]] > 0 check: only increment missing when we lose a NEEDED char"],
     tip:"'missing' variable tracks how many pattern chars are still unmet. This avoids re-counting the entire window on each slide."}
  ]
},
{
  id:"matrix", icon:"🔲", color:"#81ecec", name:"Matrix",
  tagline:"2D arrays = grids. Master traversal directions, boundary checks, and BFS/DFS on cells.",
  when:["Input is a 2D grid / matrix","Pathfinding, flood fill, island counting","Rotation, transposition problems","Diagonal or spiral traversal"],
  signals:["'Grid', 'matrix', '2D array'","Count connected components","'Rotate/transpose the matrix'","'Spiral order', 'diagonal traversal'"],
  subtypes:[
    {name:"Matrix Traversal (Row/Col/Diagonal/Spiral)",num:1,diff:"m",
     desc:"Different traversal patterns: row-by-row, column-by-column, diagonal (i+j=const or i-j=const), and spiral (4-boundary shrink).",
     template:`# Spiral traversal
def spiral(m):
    res = []
    t, b, l, r = 0, len(m)-1, 0, len(m[0])-1
    while t <= b and l <= r:
        for i in range(l, r+1): res.append(m[t][i]); t += 1  # top row
        for i in range(t, b+1): res.append(m[i][r]); r -= 1  # right col
        if t <= b:
            for i in range(r, l-1, -1): res.append(m[b][i]); b -= 1  # bottom
        if l <= r:
            for i in range(b, t-1, -1): res.append(m[i][l]); l += 1  # left
    return res

# Diagonal traversal (i+j = const)
from collections import defaultdict
def diagonal(m):
    d = defaultdict(list)
    for i in range(len(m)):
        for j in range(len(m[0])): d[i+j].append(m[i][j])
    res = []
    for k in sorted(d): res += d[k][::-1] if k%2==0 else d[k]
    return res`,
     ex:[{l:"Spiral",v:"4 boundaries shrink inward after each direction"},{l:"Diagonal",v:"Same i+j = same diagonal. Alternate direction each time"},{l:"Anti-diagonal",v:"Same i-j = same anti-diagonal"}],
     pitfalls:["Spiral: check t<=b and l<=r before bottom-row and left-col sweeps","Diagonal direction alternation: even diagonal index = reverse, odd = forward"],
     tip:"Spiral has 4 boundaries. After sweeping each direction, shrink that boundary. Check bounds before each direction except first two."},
    {name:"In-place Rotation and Transpose",num:2,diff:"m",
     desc:"Rotate matrix 90° clockwise = Transpose + Reverse each row. Rotate 90° anticlockwise = Transpose + Reverse each column.",
     template:`def rotate_90_clockwise(m):
    n = len(m)
    # Step 1: Transpose (swap across main diagonal)
    for i in range(n):
        for j in range(i+1, n):
            m[i][j], m[j][i] = m[j][i], m[i][j]
    
    # Step 2: Reverse each row
    for row in m: row.reverse()
    return m

def rotate_90_anticlockwise(m):
    n = len(m)
    # Step 1: Transpose
    for i in range(n):
        for j in range(i+1, n):
            m[i][j], m[j][i] = m[j][i], m[i][j]
    
    # Step 2: Reverse each COLUMN (not row)
    for col in range(n):
        m[:][col]  # reverse column
    m.reverse()   # simpler: reverse rows order = reverse each col`,
     ex:[{l:"Input",v:"[[1,2,3],[4,5,6],[7,8,9]]"},{l:"90° CW",v:"[[7,4,1],[8,5,2],[9,6,3]]"},{l:"Key",v:"Transpose: (i,j)↔(j,i). Reverse rows: clockwise."}],
     pitfalls:["j starts from i+1 in transpose (not 0) to avoid double-swapping","Anticlockwise: reverse column order (m.reverse()) after transpose"],
     tip:"Memorize: CW = Transpose + reverse rows. CCW = Transpose + reverse cols (or reverse rows + Transpose)."},
    {name:"BFS / DFS on Grid (Flood Fill / Islands)",num:3,diff:"m",
     desc:"Treat each cell as a graph node. BFS for shortest path, DFS for connectivity/flood fill. 4 or 8 directional movement.",
     template:`# DFS approach (flood fill)
def dfs(grid, i, j, visited):
    if (i < 0 or i >= len(grid) or
        j < 0 or j >= len(grid[0]) or
        grid[i][j] == '0' or visited[i][j]):
        return
    visited[i][j] = True
    for di, dj in [(0,1),(0,-1),(1,0),(-1,0)]:
        dfs(grid, i+di, j+dj, visited)

def count_islands(grid):
    visited = [[False]*len(grid[0]) for _ in grid]
    count = 0
    for i in range(len(grid)):
        for j in range(len(grid[0])):
            if grid[i][j] == '1' and not visited[i][j]:
                dfs(grid, i, j, visited)
                count += 1
    return count`,
     ex:[{l:"Problem",v:"Count islands, flood fill, walls/gates"},{l:"Directions",v:"4-dir: up/down/left/right. 8-dir: + diagonals"},{l:"BFS",v:"Use deque for shortest path on grid"}],
     pitfalls:["Always check bounds BEFORE accessing grid[i][j]","Mark visited BEFORE adding to BFS queue (not after popping)","For in-place: mark visited by changing value (e.g., '1'→'0')"],
     tip:"Order of bounds check matters: check i<0 BEFORE grid[i][j] to avoid index error. Use 'and' short-circuit."},
    {name:"Matrix Binary Search",num:4,diff:"m",
     desc:"Search in matrices where rows/cols are sorted. Top-right corner trick: move left if too big, move down if too small.",
     template:`# Search in row+col sorted matrix — O(m+n)
def search_matrix(mat, target):
    r, c = 0, len(mat[0]) - 1   # start at TOP-RIGHT
    while r < len(mat) and c >= 0:
        if mat[r][c] == target: return True
        elif mat[r][c] > target: c -= 1   # go left
        else: r += 1                       # go down
    return False

# Search in fully sorted matrix (rows concat = sorted) — O(log mn)
def search_sorted_matrix(mat, target):
    m, n = len(mat), len(mat[0])
    lo, hi = 0, m*n - 1
    while lo <= hi:
        mid = (lo + hi) // 2
        val = mat[mid // n][mid % n]  # convert 1D index to 2D
        if val == target: return True
        elif val < target: lo = mid + 1
        else: hi = mid - 1
    return False`,
     ex:[{l:"Row+Col sorted",v:"Top-right corner → O(m+n)"},{l:"Fully sorted",v:"Binary search with index mapping → O(log mn)"},{l:"Index map",v:"row = mid//n, col = mid%n"}],
     pitfalls:["Two different matrix types: row+col sorted vs fully sorted (rows concatenated)","Fully sorted: index mapping mid//n, mid%n is the key formula"],
     tip:"Top-right corner is the only position where moving left decreases AND moving down increases. It's the 'pivot point' for elimination."}
  ]
}
];

let activePattern = 'arrays';
let activeDiff = 'all';

function buildNav() {
  const nav = document.getElementById('nav');
  const pills = document.getElementById('pills');
  PATTERNS.forEach(p => {
    // Sidebar nav
    const div = document.createElement('div');
    div.className = 'nav-item' + (p.id === activePattern ? ' active' : '');
    div.id = 'nav-' + p.id;
    div.innerHTML = `<span style="font-size:14px">${p.icon}</span><span>${p.name}</span>`;
    div.onclick = () => scrollTo(p.id);
    nav.appendChild(div);
    // Pills
    const pill = document.createElement('button');
    pill.className = 'pill' + (p.id === activePattern ? ' on' : '');
    pill.id = 'pill-' + p.id;
    pill.textContent = p.name;
    pill.onclick = () => scrollTo(p.id);
    pills.appendChild(pill);
  });
}

function scrollTo(id) {
  document.getElementById('sec-' + id).scrollIntoView({behavior:'smooth'});
}

function buildContent() {
  const content = document.getElementById('content');
  PATTERNS.forEach((p, pi) => {
    const sec = document.createElement('div');
    sec.className = 'pcard';
    sec.id = 'sec-' + p.id;

    const whenItems = p.when.map(w => `<li>${w}</li>`).join('');
    const kwItems = p.signals.slice(0,4).map(s => `<li>${s}</li>`).join('');
    const signalItems = p.signals.slice(0,4).map(s => `<li>${s}</li>`).join('');

    let subtypesHTML = p.subtypes.map((st, si) => {
      const dc = st.diff==='e'?'diff-e':st.diff==='m'?'diff-m':'diff-h';
      const dl = st.diff==='e'?'Easy':st.diff==='m'?'Medium':'Hard';
      const exHTML = st.ex.map(e => `<div class="ex-box"><div class="ex-label">${e.l}</div><div class="ex-val">${e.v}</div></div>`).join('');
      const pitHTML = st.pitfalls.map(x => `<li>${x}</li>`).join('');
      return `
        <div class="sub" id="${p.id}-sub-${si}">
          <div class="sub-hdr" onclick="toggleSub('${p.id}-sub-${si}')">
            <h3>${st.name}</h3>
            <span class="sub-num">Type ${st.num}</span>
            <span class="sub-diff ${dc}">${dl}</span>
            <span class="sub-chv">▼</span>
          </div>
          <div class="sub-body">
            <p class="sub-desc">${st.desc}</p>
            <div class="template-label">Code Template</div>
            <div class="code">${escHtml(st.template)}</div>
            <div class="ex-row">${exHTML}</div>
            <div class="pitfalls">
              <h5>⚠ Common Pitfalls</h5>
              <ul>${pitHTML}</ul>
            </div>
            <div class="tip-box">
              <h5>💡 Recognition Tip</h5>
              <p>${st.tip}</p>
            </div>
          </div>
        </div>`;
    }).join('');

    sec.innerHTML = `
      <div class="pcard-hdr">
        <div class="pcard-icon">${p.icon}</div>
        <div class="pcard-meta">
          <h2>${p.name}</h2>
          <p>${p.tagline}</p>
          <div class="tags">
            <span class="tag tag-when">🎯 ${p.subtypes.length} subtypes</span>
          </div>
        </div>
      </div>
      <div class="when-box">
        <h4>🟢 When to Use This Pattern</h4>
        <ul class="when-list">${p.when.map(w=>`<li>${w}</li>`).join('')}</ul>
      </div>
      <div class="signals">
        <div class="sig-box">
          <h4>🔍 Problem Signals / Keywords</h4>
          <ul class="sig-list">${p.signals.map(s=>`<li>${s}</li>`).join('')}</ul>
        </div>
        <div class="sig-box">
          <h4>📋 Subtypes in this Pattern</h4>
          <ul class="sig-list">${p.subtypes.map(st=>`<li><b>${st.name}</b> — ${st.diff==='e'?'Easy':st.diff==='m'?'Medium':'Hard'}</li>`).join('')}</ul>
        </div>
      </div>
      <div class="subtypes">${subtypesHTML}</div>
      ${pi < PATTERNS.length-1 ? '<div class="sep"></div>' : ''}
    `;
    content.appendChild(sec);
  });
}

function toggleSub(id) {
  document.getElementById(id).classList.toggle('open');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// Intersection Observer for active nav highlight
function setupObserver() {
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (e.isIntersecting) {
        const id = e.target.id.replace('sec-','');
        document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
        document.querySelectorAll('.pill').forEach(n => n.classList.remove('on'));
        const navEl = document.getElementById('nav-'+id);
        const pillEl = document.getElementById('pill-'+id);
        if (navEl) navEl.classList.add('active');
        if (pillEl) pillEl.classList.add('on');
      }
    });
  }, {threshold: 0.2});
  PATTERNS.forEach(p => {
    const el = document.getElementById('sec-'+p.id);
    if (el) obs.observe(el);
  });
}

buildNav();
buildContent();
setupObserver();
</script>
