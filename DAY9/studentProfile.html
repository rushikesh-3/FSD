<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/studentprofile.css" />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card">
            <div class="row m-5">
              <div class="student-container-header text-center">
                <h3 class="card-title">Student Information</h3>
              </div>
              <div class="col-md-4 text-center mt-4">
                <img src="images/nithin.jpg" class="profile-image" alt="..." />
                <p><strong>Nithin</strong></p>
                <p><strong>CSE</strong></p>
              </div>

              <div class="col-md-8 mt-4 student-container">
                <div class="table-responsive student-container-body mt-3">
                  <table class="table table-borderless student-info-table">
                    <tr>
                      <th>Branch</th>
                      <td>CSE</td>
                    </tr>
                    <tr>
                      <th>Email</th>
                      <td>nithin@example.com</td>
                    </tr>

                    <tr>
                      <th>Number</th>
                      <td>123-456-7890</td>
                    </tr>
                    <tr>
                      <th>Date of Birth</th>
                      <td>01/01/2000</td>
                    </tr>
                    <tr>
                      <th>Gender</th>
                      <td>Male</td>
                    </tr>
                    <tr>
                      <th>Address</th>
                      <td>123 Main Street, City, Country</td>
                    </tr>
                  </table>
                </div>
                <div class="d-flex gap-3 justify-content-center mt-3">
                  <a href="#" class="btn btn-success px-4">Save</a>
                  <a href="#" class="btn btn-secondary px-4">Edit</a>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
