<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registration Form</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-8">
          <div class="card shadow-lg p-4">
            <h2 class="text-center mb-4">Student Registration Form</h2>

            <form class="row g-3 needs-validation" novalidate>
              <div class="col-md-6">
                <label for="inputName" class="form-label">Name</label>
                <input
                  type="text"
                  class="form-control"
                  id="inputName"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="inputRollNumber" class="form-label"
                  >Roll Number</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="inputRollNumber"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="inputEmail" class="form-label">Email</label>
                <div class="input-group">
                  <span class="input-group-text">@</span>
                  <input
                    type="email"
                    class="form-control"
                    id="inputEmail"
                    required
                  />
                </div>
              </div>

              <div class="col-md-6">
                <label for="inputMobile" class="form-label">Mobile</label>
                <div class="input-group">
                  <span class="input-group-text"> +91 </span>

                  <input
                    type="tel"
                    class="form-control"
                    pattern="[0-9]{10}"
                    maxlength="10"
                    id="inputMobile"
                    required
                  />
                </div>
              </div>

              <div class="col-md-12">
                <label class="form-label d-block">Gender</label>

                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="male"
                    value="male"
                    required
                  />

                  <label class="form-check-label" for="male">Male</label>
                </div>

                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="female"
                    value="female"
                  />
                  <label class="form-check-label" for="female">Female</label>
                </div>

                <div class="form-check form-check-inline">
                  <input
                    class="form-check-input"
                    type="radio"
                    name="gender"
                    id="others"
                    value="others"
                  />
                  <label class="form-check-label" for="others">Others</label>
                </div>
              </div>

              <div class="col-md-6">
                <label for="branch" class="form-label">Branch</label>
                <select id="branch" class="form-select" required>
                  <option value="" selected disabled>Select Branch</option>
                  <option>CSE</option>
                  <option>ECE</option>
                  <option>EEE</option>
                  <option>Mechanical</option>
                  <option>Civil</option>
                </select>
              </div>
              <div class="col-md-6">
                <label for="inputDOB" class="form-label">Date of Birth</label>
                <input
                  type="date"
                  class="form-control"
                  id="inputDOB"
                  required
                />
              </div>

              <div class="col-12">
                <label for="inputAddress" class="form-label">Address</label>
                <textarea
                  class="form-control"
                  id="inputAddress"
                  rows="3"
                  placeholder="eg. LB Nagar"
                  required
                ></textarea>
              </div>

              <div class="col-md-6">
                <label for="inputCity" class="form-label">City</label>
                <input
                  type="text"
                  class="form-control"
                  id="inputCity"
                  required
                />
              </div>
              <div class="col-md-6">
                <label for="inputState" class="form-label">State</label>
                <select id="inputState" class="form-select" required>
                  <option value="" selected disabled>Select State</option>
                  <option>Telangana</option>
                  <option>Andhra Pradesh</option>
                  <option>Karnataka</option>
                  <option>Tamil Nadu</option>
                  <option>Kerala</option>
                </select>
              </div>
              <div class="col-md-12">
                <label for="inputphoto" class="form-label">Upload Photo</label>
                <input
                  type="file"
                  class="form-control"
                  id="inputphoto"
                  accept="image/*"
                  required
                />
              </div>
              <div class="col-12">
                <div class="form-check">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    id="gridCheck"
                    required
                  />
                  <label class="form-check-label" for="gridCheck">
                    Terms and Conditions
                  </label>
                </div>
              </div>
              <div class="col-md-6">
                <button type="submit" class="btn btn-success w-100">
                  Register
                </button>
              </div>

              <div class="col-md-6">
                <button type="reset" class="btn btn-danger w-100">Reset</button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
